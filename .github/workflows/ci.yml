name: CI

on:
  push:
    branches: [main]
  pull_request:

# CONTRIBUTING.md conventions are enforced here, not by review: the line limit,
# the import direction, SQL placement and platform imports fail the build.
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Windows code paths are tested on Windows, not just cross-compiled.
      - name: go test (race)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: go test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      # Named, verbose, and failing if they do not run: the credential's DPAPI
      # protection and the state directory's ACL exist only on Windows.
      - name: Windows credential protection tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          out=$(go test -count=1 -v -run 'TestDPAPIRoundTripAndIdentityProtection|TestRestrictToServiceSetsProtectedACL' ./internal/agent)
          echo "$out"
          [ "$(echo "$out" | grep -c -- '--- PASS')" -eq 2 ]

      - name: cross-compile linux and windows, no cgo
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux   GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

      - name: repository checks (lines, layering, rawsql, platform)
        if: runner.os == 'Linux'
        run: go run ./scripts/ci all

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The action runs `golangci-lint config verify` first, so an invalid
      # config fails loudly. The version is pinned to the one the config was
      # verified against locally.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The API types are generated from docs/openapi.yaml: drift means a
      # hand-edit or an un-regenerated spec change.
      - name: generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code src/api/types.gen.ts
      - name: no Go files inside node_modules (they would join go build ./...)
        run: test -z "$(find node_modules -name '*.go' -print -quit)"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Browser tests: the built dashboard embedded in a real server (demo mode),
  # driven by Playwright in Chromium.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the dashboard and the server
        run: |
          (cd web && npm ci && npm run build)
          go build -o sentrix-server ./cmd/sentrix-server
      - name: install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: browser tests
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # Clean-machine acceptance: a fresh runner is the
  # clean VM. The image's demo must reach live data within 60 s; the .deb
  # packages must install, run under systemd and report.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker run to live charts
        run: scripts/smoke-docker.sh

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
      - name: build packages
        run: PATH="$PATH:$(go env GOPATH)/bin" scripts/package.sh v0.0.0-ci
      - name: install and run the .deb packages
        run: scripts/smoke-deb.sh dist

