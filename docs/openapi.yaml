openapi: 3.0.3
info:
  title: Sentrix dashboard API
  version: "1"
  description: |
    The browser API. Source of truth: web types are generated from this file
    (CI fails on drift) and Go handler responses are validated against it in
    tests.

    Authentication is a session cookie (`sentrix_session`, HttpOnly, Secure,
    SameSite=Strict). State-changing requests and the WebSocket upgrade must
    carry an `Origin` header matching the server.

    Live data: `GET /api/v1/stream` upgrades to a WebSocket. The client sends
    `{"type":"subscribe","hosts":["<id>",...]|null,"since_ms":<unix ms>}`;
    the server sends `CoreFrame` messages. Another tenant's host ids are
    silently ignored. A closed socket means "reconnect with since_ms".

    Live tail uses the same endpoint: the client sends
    `{"type":"tail","hosts":[...],"levels":[...],"q":"..."}` (filters as in
    `GET /logs`, applied server-side) and receives `LogFrame` messages.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; sets the session cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Logged out; clears the cookie. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: me
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
  /hosts:
    get:
      operationId: listHosts
      responses:
        "200":
          description: Every host of the tenant, with its latest sample.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostList" }
        "401": { $ref: "#/components/responses/Error" }
  /hosts/{id}:
    get:
      operationId: getHost
      parameters:
        - $ref: "#/components/parameters/HostID"
      responses:
        "200":
          description: One host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hosts/{id}/metrics:
    get:
      operationId: hostMetrics
      parameters:
        - $ref: "#/components/parameters/HostID"
        - name: gauges
          in: query
          required: true
          description: |
            Comma-separated metric names. Gauges: cpu, mem, disk, load1,
            load5, load15, mem_used. Rates (bytes/s, over the time the samples
            cover): net_rx_rate, net_tx_rate, disk_r_rate, disk_w_rate.
          schema: { type: string, example: "cpu,mem,net_rx_rate" }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: step
          in: query
          required: false
          description: |
            Bucket width in seconds. Default: automatic, about 300 points.
            Requests over 2000 points are refused. The data source (raw,
            1m or 1h rollups) follows the step and is reported in the frame.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Columnar series; null marks a bucket without data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Frame" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hosts/{id}/series:
    get:
      operationId: listSeries
      parameters:
        - $ref: "#/components/parameters/HostID"
      responses:
        "200":
          description: The host's detail series (per core, mount, device, NIC).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hosts/{id}/series/{sid}/metrics:
    get:
      operationId: seriesMetrics
      parameters:
        - $ref: "#/components/parameters/HostID"
        - name: sid
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: step
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Gauge means, or per-second rates for counters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailFrame" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hosts/{id}/processes:
    get:
      operationId: hostProcesses
      parameters:
        - $ref: "#/components/parameters/HostID"
        - name: at
          in: query
          required: false
          description: Newest snapshot at or before this time; default now.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Top processes by CPU and memory. Names only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /logs:
    get:
      operationId: searchLogs
      description: |
        Newest first. `q`: case-insensitive substring terms of at least 3
        characters; whitespace is AND, an uppercase OR joins its neighbours,
        "quoted phrases" are one term. Nothing in q is query syntax.
      parameters:
        - { name: hosts, in: query, required: false, description: Comma-separated host ids., schema: { type: string } }
        - { name: levels, in: query, required: false, description: Comma-separated levels., schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: One page of lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /redaction-rules:
    get:
      operationId: listRedactionRules
      responses:
        "200":
          description: The tenant's own rules (built-in rules are always on).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedactionRuleList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createRedactionRule
      description: Admin only. RE2 pattern, applied to message, source and every label.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedactionRuleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedactionRule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /redaction-rules/{rid}:
    delete:
      operationId: deleteRedactionRule
      parameters:
        - { name: rid, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      description: Admin only. The token is shown once.
      responses:
        "201":
          description: A single-use token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentToken" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /hosts/{id}/disable:
    post:
      operationId: disableHost
      description: Admin only. The agent is refused at once and the host is no longer evaluated by alert rules.
      parameters:
        - $ref: "#/components/parameters/HostID"
      responses:
        "204": { description: Disabled. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hosts/{id}/enable:
    post:
      operationId: enableHost
      description: Admin only.
      parameters:
        - $ref: "#/components/parameters/HostID"
      responses:
        "204": { description: Enabled. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /alerts:
    get:
      operationId: listAlerts
      description: Every (rule, host) not ok, and the newest events.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Current alerts and recent transitions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alerts" }
        "401": { $ref: "#/components/responses/Error" }
  /alert-rules:
    get:
      operationId: listAlertRules
      responses:
        "200":
          description: The tenant's rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRuleList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAlertRule
      description: |
        Admin only. Evaluated each minute against the last complete 1-minute
        rollup, so an alert fires at the earliest about 1.5 minutes after
        its condition starts holding for `duration_s`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /alert-rules/{rid}:
    put:
      operationId: updateAlertRule
      description: Admin only. Replaces the rule; its state and history are kept.
      parameters:
        - { name: rid, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAlertRule
      description: Admin only. Removes the rule with its state and events.
      parameters:
        - { name: rid, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /channels:
    get:
      operationId: listChannels
      description: URLs are masked for every role; a channel URL is a credential.
      responses:
        "200":
          description: The tenant's channels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createChannel
      description: Admin only. https URLs only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "201":
          description: Created (URL masked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /channels/{cid}:
    put:
      operationId: updateChannel
      description: Admin only. Sending the masked URL back keeps the stored one.
      parameters:
        - { name: cid, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "200":
          description: Updated (URL masked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteChannel
      parameters:
        - { name: cid, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /silences:
    get:
      operationId: listSilences
      responses:
        "200":
          description: The tenant's silences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SilenceList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSilence
      description: Admin only. Suppresses notifications, never transitions. At most 30 days.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SilenceInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Silence" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /silences/{sid}:
    delete:
      operationId: deleteSilence
      parameters:
        - { name: sid, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /system:
    get:
      operationId: getSystem
      description: |
        Admin only. The tenant's fleet health plus server-wide figures
        (database and WAL size, disk headroom, retention lag, live-feed
        drops). Liveness and readiness probes live outside this API at
        `GET /healthz` (process alive, no dependency checks) and
        `GET /readyz` (the database answers and the writer drains; 503 if not).
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sentrix_session
  parameters:
    HostID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    Role:
      type: string
      enum: [admin, viewer]
    Me:
      type: object
      required: [user_id, email, role, tenant_id]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        tenant_id: { type: string, format: uuid }
    HostStatus:
      type: string
      enum: [ok, stale, no_data, disabled]
    Sample:
      type: object
      required: [ts_ms, cpu, mem, disk, load1, load5, load15, mem_used, uptime, net_rx, net_tx, disk_r, disk_w]
      properties:
        ts_ms: { type: integer, format: int64 }
        cpu: { type: number }
        mem: { type: number }
        disk: { type: number }
        load1: { type: number }
        load5: { type: number }
        load15: { type: number }
        mem_used: { type: integer, format: int64 }
        uptime: { type: integer, format: int64 }
        net_rx: { type: integer, format: int64 }
        net_tx: { type: integer, format: int64 }
        disk_r: { type: integer, format: int64 }
        disk_w: { type: integer, format: int64 }
    Health:
      type: object
      required: [buffer_depth, dropped_total, clock_skew_ms, rejected_total, conflict_total]
      properties:
        buffer_depth: { type: integer }
        dropped_total: { type: integer, format: int64 }
        clock_skew_ms: { type: integer, format: int64 }
        rejected_total: { type: integer, format: int64 }
        conflict_total: { type: integer, format: int64 }
    Host:
      type: object
      required: [id, name, os, platform, agent_version, interval_ms, status, created_at, health]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        os: { type: string }
        platform: { type: string }
        agent_version: { type: string }
        interval_ms: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/HostStatus" }
        created_at: { type: string, format: date-time }
        last_seen: { type: string, format: date-time, nullable: true }
        health: { $ref: "#/components/schemas/Health" }
        latest: { allOf: [{ $ref: "#/components/schemas/Sample" }], nullable: true }
    HostList:
      type: object
      required: [hosts, server_time]
      properties:
        hosts:
          type: array
          items: { $ref: "#/components/schemas/Host" }
        server_time: { type: string, format: date-time }
    Frame:
      type: object
      required: [from, to, step_s, source, ts_ms, series]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step_s: { type: integer }
        source: { type: string, enum: [raw, 1m, 1h] }
        ts_ms:
          type: array
          items: { type: integer, format: int64 }
        series:
          type: object
          additionalProperties:
            type: array
            items: { type: number, nullable: true }
    Series:
      type: object
      required: [id, metric, kind, unit, labels]
      properties:
        id: { type: integer, format: int64 }
        metric: { type: string }
        kind: { type: string, enum: [gauge, counter] }
        unit: { type: string, enum: [percent, bytes] }
        labels:
          type: object
          additionalProperties: { type: string }
    SeriesList:
      type: object
      required: [series]
      properties:
        series:
          type: array
          items: { $ref: "#/components/schemas/Series" }
    DetailFrame:
      type: object
      required: [from, to, step_s, kind, ts_ms, values]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step_s: { type: integer }
        kind: { type: string, enum: [gauge, counter] }
        ts_ms:
          type: array
          items: { type: integer, format: int64 }
        values:
          type: array
          items: { type: number, nullable: true }
    Process:
      type: object
      required: [name, cpu, rss]
      properties:
        name: { type: string }
        cpu: { type: number }
        rss: { type: integer, format: int64 }
    ProcessSnapshot:
      type: object
      required: [ts, procs]
      properties:
        ts: { type: string, format: date-time }
        procs:
          type: array
          items: { $ref: "#/components/schemas/Process" }
    EnrollmentToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    LogEntry:
      type: object
      required: [id, host_id, ts, source, level, message, labels]
      properties:
        id: { type: integer, format: int64 }
        host_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        source: { type: string }
        level: { type: string, enum: [unknown, debug, info, warn, error, fatal] }
        message: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    LogPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }
        next_cursor: { type: string, nullable: true }
    RedactionRuleInput:
      type: object
      required: [pattern, action]
      properties:
        pattern: { type: string }
        replacement: { type: string }
        action: { type: string, enum: [mask, drop] }
    RedactionRule:
      type: object
      required: [id, pattern, replacement, action]
      properties:
        id: { type: integer, format: int64 }
        pattern: { type: string }
        replacement: { type: string }
        action: { type: string, enum: [mask, drop] }
    RedactionRuleList:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/RedactionRule" }
    LogFrame:
      description: WebSocket live-tail message from the server.
      type: object
      required: [type, host_id, lines]
      properties:
        type: { type: string, enum: [logs] }
        host_id: { type: string, format: uuid }
        lines:
          type: array
          items: { $ref: "#/components/schemas/LiveLogLine" }
    LiveLogLine:
      description: A line as it is stored; live lines carry no id.
      type: object
      required: [ts, source, level, message, labels]
      properties:
        ts: { type: string, format: date-time }
        source: { type: string }
        level: { type: string, enum: [unknown, debug, info, warn, error, fatal] }
        message: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    CoreFrame:
      description: WebSocket message from the server.
      type: object
      required: [type, host_id, samples]
      properties:
        type: { type: string, enum: [core] }
        host_id: { type: string, format: uuid }
        samples:
          type: array
          items: { $ref: "#/components/schemas/Sample" }
    AlertState:
      type: string
      enum: [ok, pending, firing]
    AlertRuleInput:
      type: object
      additionalProperties: false
      required: [name, kind, duration_s, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [threshold, no_data] }
        metric: { type: string, description: "cpu, mem, disk, load1, load5, load15, mem_used, net_rx_rate, net_tx_rate, disk_r_rate, disk_w_rate" }
        aggregation: { type: string, enum: [avg, max, min], description: Ignored for rates (one rate per bucket). }
        comparator: { type: string, enum: [gt, lt] }
        threshold: { type: number }
        duration_s: { type: integer, minimum: 60, maximum: 86400, description: Whole minutes. }
        hosts: { type: array, items: { type: string, format: uuid }, description: Empty means every host. }
        on_no_data: { type: string, enum: [fire, resolve, hold] }
        cooldown_s: { type: integer, minimum: 0, maximum: 86400 }
        channels: { type: array, items: { type: integer, format: int64 } }
        enabled: { type: boolean }
    AlertRule:
      type: object
      required: [id, name, kind, metric, aggregation, comparator, threshold, duration_s, hosts, on_no_data, cooldown_s, channels, enabled, inert]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [threshold, no_data] }
        metric: { type: string }
        aggregation: { type: string }
        comparator: { type: string }
        threshold: { type: number }
        duration_s: { type: integer }
        hosts: { type: array, items: { type: string, format: uuid } }
        on_no_data: { type: string }
        cooldown_s: { type: integer }
        channels: { type: array, items: { type: integer, format: int64 } }
        enabled: { type: boolean }
        inert: { type: boolean, description: The rule matches no enabled host and cannot fire. }
    AlertRuleList:
      type: object
      required: [rules]
      properties:
        rules: { type: array, items: { $ref: "#/components/schemas/AlertRule" } }
    ChannelInput:
      type: object
      additionalProperties: false
      required: [name, kind, url]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [webhook, slack] }
        url: { type: string }
    Channel:
      type: object
      required: [id, name, kind, url]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [webhook, slack] }
        url: { type: string, description: "Masked: scheme and host only." }
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels: { type: array, items: { $ref: "#/components/schemas/Channel" } }
    SilenceInput:
      type: object
      additionalProperties: false
      required: [starts, ends]
      properties:
        rule_id: { type: integer, format: int64, nullable: true }
        host_id: { type: string, format: uuid, nullable: true }
        starts: { type: string, format: date-time }
        ends: { type: string, format: date-time }
        reason: { type: string, maxLength: 200 }
    Silence:
      type: object
      required: [id, rule_id, host_id, starts, ends, reason]
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64, nullable: true }
        host_id: { type: string, format: uuid, nullable: true }
        starts: { type: string, format: date-time }
        ends: { type: string, format: date-time }
        reason: { type: string }
    SilenceList:
      type: object
      required: [silences]
      properties:
        silences: { type: array, items: { $ref: "#/components/schemas/Silence" } }
    Alerts:
      type: object
      required: [states, events]
      properties:
        states:
          type: array
          items:
            type: object
            required: [rule_id, host_id, state, since]
            properties:
              rule_id: { type: integer, format: int64 }
              host_id: { type: string, format: uuid }
              state: { $ref: "#/components/schemas/AlertState" }
              since: { type: string, format: date-time }
        events:
          type: array
          items: { $ref: "#/components/schemas/AlertEvent" }
    AlertEvent:
      type: object
      required: [id, rule_id, host_id, from, to, at, value, notified, outcome, delivery]
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64 }
        host_id: { type: string, format: uuid }
        from: { $ref: "#/components/schemas/AlertState" }
        to: { $ref: "#/components/schemas/AlertState" }
        at: { type: string, format: date-time }
        value: { type: number, nullable: true }
        notified: { type: boolean, description: "A notification was due (not silenced, not in cooldown)." }
        outcome: { type: string, enum: ["", delivered, failed], description: Empty while delivery is pending. }
        delivery: { type: string, description: "Per-channel failures, if any." }
    AlertWebhook:
      description: The body POSTed to a webhook channel.
      type: object
      required: [rule, host, state, at, resolved]
      properties:
        rule: { type: string }
        host: { type: string }
        state: { $ref: "#/components/schemas/AlertState" }
        metric: { type: string }
        value: { type: number }
        at: { type: string, format: date-time }
        resolved: { type: boolean }
    System:
      type: object
      required: [server_time, fleet, server]
      properties:
        server_time: { type: string, format: date-time }
        fleet:
          type: object
          required: [hosts, reporting, stale, no_data, disabled, max_host_lag_s, agent_wal_depth_max, agent_wal_depth_total, agent_dropped_total]
          properties:
            hosts: { type: integer }
            reporting: { type: integer }
            stale: { type: integer }
            no_data: { type: integer }
            disabled: { type: integer }
            max_host_lag_s: { type: integer, description: Longest silence among enabled hosts that have reported. }
            agent_wal_depth_max: { type: integer, description: Largest agent backlog (batches waiting on disk). }
            agent_wal_depth_total: { type: integer }
            agent_dropped_total: { type: integer, description: "Batches agents dropped (WAL full, too old, refused)." }
        server:
          type: object
          required: [db_bytes, db_wal_bytes, disk_free_ratio, ttl_overdue_s, janitor_last_run, ws_subscribers, ws_dropped, writer_waits, writer_wait_ms]
          properties:
            db_bytes: { type: integer }
            db_wal_bytes: { type: integer }
            disk_free_ratio: { type: number, nullable: true }
            ttl_overdue_s: { type: integer, description: Age of the oldest row past its retention; should stay near zero. }
            janitor_last_run: { type: string, format: date-time, nullable: true }
            ws_subscribers: { type: integer }
            ws_dropped: { type: integer, description: Live frames dropped for slow subscribers. }
            writer_waits: { type: integer }
            writer_wait_ms: { type: integer }
