openapi: 3.0.3
info:
  title: Sentrix dashboard API
  version: "1"
  description: |
    The browser API. Source of truth: web types are generated from this file
    (CI fails on drift) and Go handler responses are validated against it in
    tests.

    Authentication is a session cookie (`sentrix_session`, HttpOnly, Secure,
    SameSite=Strict). State-changing requests and the WebSocket upgrade must
    carry an `Origin` header matching the server.

    Live data: `GET /api/v1/stream` upgrades to a WebSocket. The client sends
    `{"type":"subscribe","hosts":["<id>",...]|null,"since_ms":<unix ms>}`;
    the server sends `CoreFrame` messages. Another tenant's host ids are
    silently ignored. A closed socket means "reconnect with since_ms".

    Live tail uses the same endpoint: the client sends
    `{"type":"tail","hosts":[...],"levels":[...],"q":"..."}` (filters as in
    `GET /logs`, applied server-side) and receives `LogFrame` messages.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; sets the session cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Logged out; clears the cookie. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: me
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
  /hosts:
    get:
      operationId: listHosts
      responses:
        "200":
          description: Every host of the tenant, with its latest sample.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostList" }
        "401": { $ref: "#/components/responses/Error" }
  /hosts/{id}:
    get:
      operationId: getHost
      parameters:
        - $ref: "#/components/parameters/HostID"
      responses:
        "200":
          description: One host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hosts/{id}/metrics:
    get:
      operationId: hostMetrics
      parameters:
        - $ref: "#/components/parameters/HostID"
        - name: gauges
          in: query
          required: true
          description: |
            Comma-separated metric names. Gauges: cpu, mem, disk, load1,
            load5, load15, mem_used. Rates (bytes/s, over the time the samples
            cover): net_rx_rate, net_tx_rate, disk_r_rate, disk_w_rate.
          schema: { type: string, example: "cpu,mem,net_rx_rate" }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: step
          in: query
          required: false
          description: |
            Bucket width in seconds. Default: automatic, about 300 points.
            Requests over 2000 points are refused. The data source (raw,
            1m or 1h rollups) follows the step and is reported in the frame.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Columnar series; null marks a bucket without data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Frame" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hosts/{id}/series:
    get:
      operationId: listSeries
      parameters:
        - $ref: "#/components/parameters/HostID"
      responses:
        "200":
          description: The host's detail series (per core, mount, device, NIC).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hosts/{id}/series/{sid}/metrics:
    get:
      operationId: seriesMetrics
      parameters:
        - $ref: "#/components/parameters/HostID"
        - name: sid
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: step
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Gauge means, or per-second rates for counters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailFrame" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hosts/{id}/processes:
    get:
      operationId: hostProcesses
      parameters:
        - $ref: "#/components/parameters/HostID"
        - name: at
          in: query
          required: false
          description: Newest snapshot at or before this time; default now.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Top processes by CPU and memory. Names only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /logs:
    get:
      operationId: searchLogs
      description: |
        Newest first. `q`: case-insensitive substring terms of at least 3
        characters; whitespace is AND, an uppercase OR joins its neighbours,
        "quoted phrases" are one term. Nothing in q is query syntax.
      parameters:
        - { name: hosts, in: query, required: false, description: Comma-separated host ids., schema: { type: string } }
        - { name: levels, in: query, required: false, description: Comma-separated levels., schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: One page of lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /redaction-rules:
    get:
      operationId: listRedactionRules
      responses:
        "200":
          description: The tenant's own rules (built-in rules are always on).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedactionRuleList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createRedactionRule
      description: Admin only. RE2 pattern, applied to message, source and every label.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedactionRuleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedactionRule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /redaction-rules/{rid}:
    delete:
      operationId: deleteRedactionRule
      parameters:
        - { name: rid, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      description: Admin only. The token is shown once.
      responses:
        "201":
          description: A single-use token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentToken" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /hosts/{id}/disable:
    post:
      operationId: disableHost
      description: Admin only. The agent is refused at once and the host is no longer evaluated by alert rules.
      parameters:
        - $ref: "#/components/parameters/HostID"
      responses:
        "204": { description: Disabled. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hosts/{id}/enable:
    post:
      operationId: enableHost
      description: Admin only.
      parameters:
        - $ref: "#/components/parameters/HostID"
      responses:
        "204": { description: Enabled. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /alerts:
    get:
      operationId: listAlerts
      description: Every (rule, host) not ok, and the newest events.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Current alerts and recent transitions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alerts" }
        "401": { $ref: "#/components/responses/Error" }
  /alert-rules:
    get:
      operationId: listAlertRules
      responses:
        "200":
          description: The tenant's rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRuleList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAlertRule
      description: |
        Admin only. Evaluated each minute against the last complete 1-minute
        rollup, so an alert fires at the earliest about 1.5 minutes after
        its condition starts holding for `duration_s`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /alert-rules/{rid}:
    put:
      operationId: updateAlertRule
      description: Admin only. Replaces the rule; its state and history are kept.
      parameters:
        - { name: rid, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAlertRule
      description: Admin only. Removes the rule with its state and events.
      parameters:
        - { name: rid, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /channels:
    get:
      operationId: listChannels
      description: URLs are masked for every role; a channel URL is a credential.
      responses:
        "200":
          description: The tenant's channels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createChannel
      description: Admin only. https URLs only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "201":
          description: Created (URL masked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /channels/{cid}:
    put:
      operationId: updateChannel
      description: Admin only. Sending the masked URL back keeps the stored one.
      parameters:
        - { name: cid, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "200":
          description: Updated (URL masked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteChannel
      parameters:
        - { name: cid, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /silences:
    get:
      operationId: listSilences
      responses:
        "200":
          description: The tenant's silences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SilenceList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSilence
      description: Admin only. Suppresses notifications, never transitions. At most 30 days.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SilenceInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Silence" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /silences/{sid}:
    delete:
      operationId: deleteSilence
      parameters:
        - { name: sid, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /monitors:
    get:
      operationId: listMonitors
      description: |
        Every uptime monitor with its state, uptime over 24 h and 30 d and
        the last 30 daily bars. Uptime is up / (up + down) over monitored
        time: paused periods and gaps when the server was not checking
        count as neither, so it is absent (null) when nothing was monitored.
      responses:
        "200":
          description: The tenant's monitors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createMonitor
      description: |
        Admin only. Checked from the server. Private and loopback targets are
        refused at connection time unless the operator allows them; cloud
        metadata addresses always are. Refused with 429 at the plan's
        max_monitors, and an interval below its min_check_interval is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
      responses:
        "201":
          description: Created; the first check runs at once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /monitors/{mid}:
    parameters:
      - $ref: "#/components/parameters/MonitorID"
    get:
      operationId: getMonitor
      description: One monitor with uptime over 24 h, 7 d, 30 d and 90 d and 90 daily bars.
      responses:
        "200":
          description: The monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateMonitor
      description: Admin only. A new kind or target starts the state over and ends any open incident.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMonitor
      description: Admin only. Removes the monitor with its history.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /monitors/{mid}/pause:
    parameters:
      - $ref: "#/components/parameters/MonitorID"
    post:
      operationId: pauseMonitor
      description: Admin only. Stops checking; an open incident ends now. Paused time does not count against uptime.
      responses:
        "204": { description: Paused (or already paused). }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /monitors/{mid}/resume:
    parameters:
      - $ref: "#/components/parameters/MonitorID"
    post:
      operationId: resumeMonitor
      description: Admin only. Starts checking again from state pending.
      responses:
        "204": { description: Resumed (or already running). }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /monitors/{mid}/check:
    parameters:
      - $ref: "#/components/parameters/MonitorID"
    post:
      operationId: checkMonitorNow
      description: Admin only. Runs a check at once; at most every 10 s per monitor (429), never while one runs (409).
      responses:
        "202": { description: The check is queued; its result appears in the results. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /monitors/{mid}/results:
    parameters:
      - $ref: "#/components/parameters/MonitorID"
    get:
      operationId: listMonitorResults
      description: Checks in [from, to), oldest first; at most 7 days, the newest 20 000 when there are more.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: The checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResultList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /monitors/{mid}/incidents:
    parameters:
      - $ref: "#/components/parameters/MonitorID"
    get:
      operationId: listMonitorIncidents
      description: The newest incidents and notification events, newest first.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Incidents and events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /system:
    get:
      operationId: getSystem
      description: |
        Admin only. The tenant's fleet health plus server-wide figures
        (database and WAL size, disk headroom, retention lag, live-feed
        drops). Liveness and readiness probes live outside this API at
        `GET /healthz` (process alive, no dependency checks) and
        `GET /readyz` (the database answers and the writer drains; 503 if not).
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /usage:
    get:
      operationId: getUsage
      description: The tenant's plan and its metered usage (today and this calendar month, UTC). Every role.
      responses:
        "200":
          description: Plan and usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "401": { $ref: "#/components/responses/Error" }
  /export:
    get:
      operationId: exportData
      description: |
        Admin only. Streams the tenant's own data: `metrics` (raw core
        samples, kept 7 days by default), `logs`, or `alert_events`, as CSV
        or NDJSON (default). Every parameter is validated before any byte is
        sent, so a bad request is a JSON error. A failure after streaming
        has started cannot change the status: NDJSON then ends with an
        `{"error": …}` record; CSV simply ends early — use NDJSON when
        completeness must be checked. At most 400 days per request.
      parameters:
        - { name: table, in: query, required: true, schema: { type: string, enum: [metrics, logs, alert_events] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: format, in: query, schema: { type: string, enum: [csv, ndjson] } }
        - { name: host, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The export, streamed.
          content:
            text/csv: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sentrix_session
  parameters:
    HostID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MonitorID:
      name: mid
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    Role:
      type: string
      enum: [admin, viewer]
    Me:
      type: object
      required: [user_id, email, role, tenant_id]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        tenant_id: { type: string, format: uuid }
    HostStatus:
      type: string
      enum: [ok, stale, no_data, disabled]
    Sample:
      type: object
      required: [ts_ms, cpu, mem, disk, load1, load5, load15, mem_used, uptime, net_rx, net_tx, disk_r, disk_w]
      properties:
        ts_ms: { type: integer, format: int64 }
        cpu: { type: number }
        mem: { type: number }
        disk: { type: number }
        load1: { type: number }
        load5: { type: number }
        load15: { type: number }
        mem_used: { type: integer, format: int64 }
        uptime: { type: integer, format: int64 }
        net_rx: { type: integer, format: int64 }
        net_tx: { type: integer, format: int64 }
        disk_r: { type: integer, format: int64 }
        disk_w: { type: integer, format: int64 }
    Health:
      type: object
      required: [buffer_depth, dropped_total, clock_skew_ms, rejected_total, conflict_total]
      properties:
        buffer_depth: { type: integer }
        dropped_total: { type: integer, format: int64 }
        clock_skew_ms: { type: integer, format: int64 }
        rejected_total: { type: integer, format: int64 }
        conflict_total: { type: integer, format: int64 }
    Host:
      type: object
      required: [id, name, os, platform, agent_version, interval_ms, status, created_at, health]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        os: { type: string }
        platform: { type: string }
        agent_version: { type: string }
        interval_ms: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/HostStatus" }
        created_at: { type: string, format: date-time }
        last_seen: { type: string, format: date-time, nullable: true }
        health: { $ref: "#/components/schemas/Health" }
        latest: { allOf: [{ $ref: "#/components/schemas/Sample" }], nullable: true }
    HostList:
      type: object
      required: [hosts, server_time]
      properties:
        hosts:
          type: array
          items: { $ref: "#/components/schemas/Host" }
        server_time: { type: string, format: date-time }
    Frame:
      type: object
      required: [from, to, step_s, source, ts_ms, series]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step_s: { type: integer }
        source: { type: string, enum: [raw, 1m, 1h] }
        ts_ms:
          type: array
          items: { type: integer, format: int64 }
        series:
          type: object
          additionalProperties:
            type: array
            items: { type: number, nullable: true }
    Series:
      type: object
      required: [id, metric, kind, unit, labels]
      properties:
        id: { type: integer, format: int64 }
        metric: { type: string }
        kind: { type: string, enum: [gauge, counter] }
        unit: { type: string, enum: [percent, bytes] }
        labels:
          type: object
          additionalProperties: { type: string }
    SeriesList:
      type: object
      required: [series]
      properties:
        series:
          type: array
          items: { $ref: "#/components/schemas/Series" }
    DetailFrame:
      type: object
      required: [from, to, step_s, kind, ts_ms, values]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step_s: { type: integer }
        kind: { type: string, enum: [gauge, counter] }
        ts_ms:
          type: array
          items: { type: integer, format: int64 }
        values:
          type: array
          items: { type: number, nullable: true }
    Process:
      type: object
      required: [name, cpu, rss]
      properties:
        name: { type: string }
        cpu: { type: number }
        rss: { type: integer, format: int64 }
    ProcessSnapshot:
      type: object
      required: [ts, procs]
      properties:
        ts: { type: string, format: date-time }
        procs:
          type: array
          items: { $ref: "#/components/schemas/Process" }
    EnrollmentToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    LogEntry:
      type: object
      required: [id, host_id, ts, source, level, message, labels]
      properties:
        id: { type: integer, format: int64 }
        host_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        source: { type: string }
        level: { type: string, enum: [unknown, debug, info, warn, error, fatal] }
        message: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    LogPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }
        next_cursor: { type: string, nullable: true }
    RedactionRuleInput:
      type: object
      required: [pattern, action]
      properties:
        pattern: { type: string }
        replacement: { type: string }
        action: { type: string, enum: [mask, drop] }
    RedactionRule:
      type: object
      required: [id, pattern, replacement, action]
      properties:
        id: { type: integer, format: int64 }
        pattern: { type: string }
        replacement: { type: string }
        action: { type: string, enum: [mask, drop] }
    RedactionRuleList:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/RedactionRule" }
    LogFrame:
      description: WebSocket live-tail message from the server.
      type: object
      required: [type, host_id, lines]
      properties:
        type: { type: string, enum: [logs] }
        host_id: { type: string, format: uuid }
        lines:
          type: array
          items: { $ref: "#/components/schemas/LiveLogLine" }
    LiveLogLine:
      description: A line as it is stored; live lines carry no id.
      type: object
      required: [ts, source, level, message, labels]
      properties:
        ts: { type: string, format: date-time }
        source: { type: string }
        level: { type: string, enum: [unknown, debug, info, warn, error, fatal] }
        message: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    CoreFrame:
      description: WebSocket message from the server.
      type: object
      required: [type, host_id, samples]
      properties:
        type: { type: string, enum: [core] }
        host_id: { type: string, format: uuid }
        samples:
          type: array
          items: { $ref: "#/components/schemas/Sample" }
    AlertState:
      type: string
      enum: [ok, pending, firing]
    AlertRuleInput:
      type: object
      additionalProperties: false
      required: [name, kind, duration_s, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [threshold, no_data] }
        metric: { type: string, description: "cpu, mem, disk, load1, load5, load15, mem_used, net_rx_rate, net_tx_rate, disk_r_rate, disk_w_rate" }
        aggregation: { type: string, enum: [avg, max, min], description: Ignored for rates (one rate per bucket). }
        comparator: { type: string, enum: [gt, lt] }
        threshold: { type: number }
        duration_s: { type: integer, minimum: 60, maximum: 86400, description: Whole minutes. }
        hosts: { type: array, items: { type: string, format: uuid }, description: Empty means every host. }
        on_no_data: { type: string, enum: [fire, resolve, hold] }
        cooldown_s: { type: integer, minimum: 0, maximum: 86400 }
        channels: { type: array, items: { type: integer, format: int64 } }
        enabled: { type: boolean }
    AlertRule:
      type: object
      required: [id, name, kind, metric, aggregation, comparator, threshold, duration_s, hosts, on_no_data, cooldown_s, channels, enabled, inert]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [threshold, no_data] }
        metric: { type: string }
        aggregation: { type: string }
        comparator: { type: string }
        threshold: { type: number }
        duration_s: { type: integer }
        hosts: { type: array, items: { type: string, format: uuid } }
        on_no_data: { type: string }
        cooldown_s: { type: integer }
        channels: { type: array, items: { type: integer, format: int64 } }
        enabled: { type: boolean }
        inert: { type: boolean, description: The rule matches no enabled host and cannot fire. }
    AlertRuleList:
      type: object
      required: [rules]
      properties:
        rules: { type: array, items: { $ref: "#/components/schemas/AlertRule" } }
    ChannelInput:
      type: object
      additionalProperties: false
      required: [name, kind, url]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [webhook, slack] }
        url: { type: string }
    Channel:
      type: object
      required: [id, name, kind, url]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [webhook, slack] }
        url: { type: string, description: "Masked: scheme and host only." }
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels: { type: array, items: { $ref: "#/components/schemas/Channel" } }
    SilenceInput:
      type: object
      additionalProperties: false
      required: [starts, ends]
      properties:
        rule_id: { type: integer, format: int64, nullable: true }
        host_id: { type: string, format: uuid, nullable: true }
        monitor_id: { type: integer, format: int64, nullable: true, description: "This monitor only; not with rule_id or host_id." }
        starts: { type: string, format: date-time }
        ends: { type: string, format: date-time }
        reason: { type: string, maxLength: 200 }
    Silence:
      type: object
      required: [id, rule_id, host_id, monitor_id, starts, ends, reason]
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64, nullable: true }
        host_id: { type: string, format: uuid, nullable: true }
        monitor_id: { type: integer, format: int64, nullable: true }
        starts: { type: string, format: date-time }
        ends: { type: string, format: date-time }
        reason: { type: string }
    SilenceList:
      type: object
      required: [silences]
      properties:
        silences: { type: array, items: { $ref: "#/components/schemas/Silence" } }
    Alerts:
      type: object
      required: [states, events]
      properties:
        states:
          type: array
          items:
            type: object
            required: [rule_id, host_id, state, since]
            properties:
              rule_id: { type: integer, format: int64 }
              host_id: { type: string, format: uuid }
              state: { $ref: "#/components/schemas/AlertState" }
              since: { type: string, format: date-time }
        events:
          type: array
          items: { $ref: "#/components/schemas/AlertEvent" }
    AlertEvent:
      type: object
      required: [id, rule_id, host_id, from, to, at, value, notified, outcome, delivery]
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64 }
        host_id: { type: string, format: uuid }
        from: { $ref: "#/components/schemas/AlertState" }
        to: { $ref: "#/components/schemas/AlertState" }
        at: { type: string, format: date-time }
        value: { type: number, nullable: true }
        notified: { type: boolean, description: "A notification was due (not silenced, not in cooldown)." }
        outcome: { type: string, enum: ["", delivered, failed], description: Empty while delivery is pending. }
        delivery: { type: string, description: "Per-channel failures, if any." }
    AlertWebhook:
      description: The body POSTed to a webhook channel for an alert transition.
      type: object
      required: [source, rule, host, state, at, resolved]
      properties:
        source: { type: string, enum: [alert] }
        rule: { type: string }
        host: { type: string }
        state: { $ref: "#/components/schemas/AlertState" }
        metric: { type: string }
        value: { type: number }
        at: { type: string, format: date-time }
        resolved: { type: boolean }
    MonitorKind:
      type: string
      enum: [http, tcp, ping]
    MonitorInput:
      type: object
      additionalProperties: false
      required: [name, kind, target, interval_s]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: "#/components/schemas/MonitorKind" }
        target: { type: string, description: "http: an http(s) URL; tcp: host:port; ping: a host name or IP address." }
        interval_s: { type: integer, minimum: 30, maximum: 86400 }
        timeout_s: { type: integer, minimum: 1, maximum: 30, description: "Default 10 (capped below the interval)." }
        confirm_retries: { type: integer, minimum: 0, maximum: 3, description: "Quick re-checks that must also fail before an incident opens. Default 1." }
        method: { type: string, enum: [GET, HEAD], description: "http only. Default GET." }
        accept_status: { type: string, description: 'http only: accepted final status codes, e.g. "200-299,301". Default 200-399.' }
        keyword: { type: string, maxLength: 200 }
        keyword_mode: { type: string, enum: ["", present, absent] }
        keyword_case_sensitive: { type: boolean }
        cert_warn_days: { type: integer, minimum: 0, maximum: 365, description: "https only: warn this many days before the certificate chain expires; 0 turns warnings off. Default 14 for https." }
        channels: { type: array, items: { type: integer, format: int64 } }
    Monitor:
      type: object
      required: [id, name, kind, target, interval_s, timeout_s, confirm_retries, method, accept_status, keyword, keyword_mode,
        keyword_case_sensitive, cert_warn_days, channels, paused, created_at, state, uptime, avg_latency_ms, bars]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: "#/components/schemas/MonitorKind" }
        target: { type: string }
        interval_s: { type: integer }
        timeout_s: { type: integer }
        confirm_retries: { type: integer }
        method: { type: string }
        accept_status: { type: string }
        keyword: { type: string }
        keyword_mode: { type: string, enum: ["", present, absent] }
        keyword_case_sensitive: { type: boolean }
        cert_warn_days: { type: integer }
        channels: { type: array, items: { type: integer, format: int64 } }
        paused: { type: boolean }
        created_at: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/MonitorState" }
        uptime:
          type: object
          description: Uptime ratio (0-1) per window; a window is absent when nothing in it was monitored.
          properties:
            "24h": { type: number }
            "7d": { type: number }
            "30d": { type: number }
            "90d": { type: number }
        avg_latency_ms: { type: integer, nullable: true, description: Mean over the last 24 h of checks that measured one. }
        bars: { type: array, items: { $ref: "#/components/schemas/DayBar" } }
    MonitorState:
      type: object
      required: [status, since, last_check, failures, cert_status, cert_expires_at]
      properties:
        status: { type: string, enum: [pending, up, down, paused] }
        since: { type: string, format: date-time, description: "down: the first failed check of the incident." }
        last_check: { type: string, format: date-time, nullable: true }
        failures: { type: integer, description: Consecutive failed checks. }
        cert_status: { type: string, enum: [ok, expiring], nullable: true }
        cert_expires_at: { type: string, format: date-time, nullable: true }
    DayBar:
      type: object
      required: [day, up_s, down_s, failures]
      properties:
        day: { type: string, format: date }
        up_s: { type: integer }
        down_s: { type: integer, description: "Both zero: the day was not monitored (a gap, not 100 %)." }
        failures: { type: integer }
    MonitorList:
      type: object
      required: [monitors, ping_available]
      properties:
        monitors: { type: array, items: { $ref: "#/components/schemas/Monitor" } }
        ping_available: { type: boolean, description: Whether this server can run ping monitors. }
    CheckResult:
      type: object
      required: [at, outcome, error, latency_ms, ttfb_ms, status, loss, cert_expires_at]
      properties:
        at: { type: string, format: date-time }
        outcome: { type: string, enum: [up, down, unknown], description: "unknown: the server's own network was down." }
        error: { allOf: [{ $ref: "#/components/schemas/CheckErrorClass" }], nullable: true }
        latency_ms: { type: integer, nullable: true }
        ttfb_ms: { type: integer, nullable: true }
        status: { type: integer, nullable: true }
        loss: { type: integer, nullable: true, description: "ping: percent of echoes lost." }
        cert_expires_at: { type: string, format: date-time, nullable: true }
    CheckResultList:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/CheckResult" } }
    Incident:
      type: object
      required: [id, started, ended, error, failures, duration_s]
      properties:
        id: { type: integer, format: int64 }
        started: { type: string, format: date-time }
        ended: { type: string, format: date-time, nullable: true }
        error: { $ref: "#/components/schemas/CheckErrorClass" }
        failures: { type: integer }
        duration_s: { type: integer, description: "To the end, or to now while open." }
    MonitorEvent:
      type: object
      required: [id, kind, at, error, down_for_s, cert_expires_at, notified, outcome, delivery]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [down, up, cert_expiring, cert_renewed] }
        at: { type: string, format: date-time }
        error: { allOf: [{ $ref: "#/components/schemas/CheckErrorClass" }], nullable: true }
        down_for_s: { type: integer, nullable: true }
        cert_expires_at: { type: string, format: date-time, nullable: true }
        notified: { type: boolean }
        outcome: { type: string, enum: ["", delivered, failed] }
        delivery: { type: string }
    IncidentList:
      type: object
      required: [incidents, events]
      properties:
        incidents: { type: array, items: { $ref: "#/components/schemas/Incident" } }
        events: { type: array, items: { $ref: "#/components/schemas/MonitorEvent" } }
    MonitorWebhook:
      description: The body POSTed to a webhook channel for an uptime monitor event.
      type: object
      required: [source, monitor, target, event, at, resolved]
      additionalProperties: false
      properties:
        source: { type: string, enum: [monitor] }
        monitor: { type: string }
        target: { type: string }
        event: { type: string, enum: [down, up, cert_expiring, cert_renewed] }
        at: { type: string, format: date-time }
        resolved: { type: boolean, description: True for up and cert_renewed. }
        error: { $ref: "#/components/schemas/CheckErrorClass" }
        down_for_s: { type: integer, description: "up: how long the incident lasted." }
        cert_expires_at: { type: string, format: date-time }
    CheckErrorClass:
      type: string
      description: Why a check failed. The only failure detail stored; never a response body or raw network error.
      enum: [dns, connect, timeout, tls, status, keyword, blocked, ping_loss]
    System:
      type: object
      required: [server_time, fleet, server]
      properties:
        server_time: { type: string, format: date-time }
        fleet:
          type: object
          required: [hosts, reporting, stale, no_data, disabled, max_host_lag_s, agent_wal_depth_max, agent_wal_depth_total, agent_dropped_total]
          properties:
            hosts: { type: integer }
            reporting: { type: integer }
            stale: { type: integer }
            no_data: { type: integer }
            disabled: { type: integer }
            max_host_lag_s: { type: integer, description: Longest silence among enabled hosts that have reported. }
            agent_wal_depth_max: { type: integer, description: Largest agent backlog (batches waiting on disk). }
            agent_wal_depth_total: { type: integer }
            agent_dropped_total: { type: integer, description: "Batches agents dropped (WAL full, too old, refused)." }
        server:
          type: object
          required: [db_bytes, db_wal_bytes, disk_free_ratio, ttl_overdue_s, janitor_last_run, ws_subscribers, ws_dropped, writer_waits, writer_wait_ms, uptime]
          properties:
            uptime:
              type: object
              description: Uptime checking across every tenant.
              required: [monitors, running, checks, skipped, stale, max_lateness_ms, references_configured, ping_available]
              properties:
                monitors: { type: integer, description: Monitors being scheduled (unpaused). }
                running: { type: integer }
                checks: { type: integer, description: Checks run since start. }
                skipped: { type: integer, description: Checks dropped because no worker was free for a whole interval; should stay 0. }
                stale: { type: integer, description: Results discarded because the monitor changed while it was checked. }
                max_lateness_ms: { type: integer, description: "Worst delay between a check being due and starting, since start." }
                references_configured: { type: boolean, description: "Without references, the server's own outage reports every monitor down." }
                ping_available: { type: boolean }
            db_bytes: { type: integer }
            db_wal_bytes: { type: integer }
            disk_free_ratio: { type: number, nullable: true }
            ttl_overdue_s: { type: integer, description: Age of the oldest row past its retention; should stay near zero. }
            janitor_last_run: { type: string, format: date-time, nullable: true }
            ws_subscribers: { type: integer }
            ws_dropped: { type: integer, description: Live frames dropped for slow subscribers. }
            writer_waits: { type: integer }
            writer_wait_ms: { type: integer }
    Usage:
      type: object
      required: [plan, usage]
      properties:
        plan:
          type: object
          required: [max_hosts, log_bytes_per_day, metrics_retention_days, logs_retention_days, max_monitors, min_check_interval_s]
          properties:
            max_monitors: { type: integer, description: Uptime monitors allowed; beyond it new monitors are refused. }
            min_check_interval_s: { type: integer, description: Shortest check interval a monitor may use. }
            max_hosts: { type: integer, description: Enabled hosts allowed; beyond it new enrollments are refused. }
            log_bytes_per_day: { type: integer, format: int64 }
            metrics_retention_days: { type: integer }
            logs_retention_days: { type: integer }
        usage:
          type: object
          required: [hosts, log_bytes_today, month_samples, month_log_bytes, month_peak_hosts, monitors, month_checks]
          properties:
            monitors: { type: integer }
            month_checks: { type: integer, format: int64, description: Uptime checks stored this month. }
            hosts: { type: integer }
            log_bytes_today: { type: integer, format: int64 }
            month_samples: { type: integer, format: int64 }
            month_log_bytes: { type: integer, format: int64 }
            month_peak_hosts: { type: integer, description: Most distinct hosts reporting on one day this month. }
